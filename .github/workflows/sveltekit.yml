name: Deploy SvelteKit site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .svelte-kit
            ~/.local/share/pnpm/store
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-sveltejs-${{ hashFiles('**/pnpm-lock.yaml') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-sveltejs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build with SvelteKit
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          DEBUG: 'vite:*'

      - name: Upload artifact
        if: success()
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Add .nojekyll file
        if: success()
        run: touch build/.nojekyll

      - name: Debug build output
        if: failure()
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo "=== Check if build folder exists ==="
          ls -la build || echo "build folder does not exist"
          echo "=== Check package.json ==="
          cat package.json | grep -A 5 '"scripts"'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
